<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapwright Agent</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e3de; --soft: #f0f0ec;
    --accent: #2f5bea; --accent-text: #ffffff; --warn: #a15c00; --warn-bg: #fff4e0;
    --ok: #1d7a3e; --ok-bg: #e7f6ec; --bad: #b42318; --bad-bg: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --card: #1f1f1d; --text: #ececea; --muted: #a3a39d; --line: #33332f; --soft: #262624;
      --accent: #7c9bff; --accent-text: #0e0e0d; --warn: #ffb547; --warn-bg: #332611;
      --ok: #6fd193; --ok-bg: #12291a; --bad: #ff8a80; --bad-bg: #3a1714;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap;
           max-width: 1240px; margin: 0 auto; padding: 24px 16px 8px; }
  header h1 { font-size: 22px; margin: 0; }
  main { max-width: 1240px; margin: 0 auto; padding: 0 16px 64px; }
  a { color: var(--accent); }
  .muted, .hint { color: var(--muted); } .hint { font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
  h2 { font-size: 16px; margin: 0 0 10px; } h3 { font-size: 15px; margin: 0 0 6px; }
  label { display: block; font-weight: 600; margin: 8px 0 4px; font-size: 14px; }
  input[type=text], select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
       background: var(--bg); color: var(--text); font: inherit; }
  textarea { min-height: 64px; resize: vertical; }
  button { font: inherit; font-weight: 600; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--line);
           background: var(--card); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.small { padding: 3px 10px; font-size: 13px; font-weight: 500; }
  button:disabled { opacity: .5; cursor: wait; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
  .row > * { flex: 1 1 180px; }
  .layout { display: grid; grid-template-columns: minmax(300px, 420px) 1fr; gap: 12px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  .tiles { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .tile { background: var(--soft); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  .tile b { font-size: 16px; margin-right: 4px; }
  .links { display: flex; gap: 12px; flex-wrap: wrap; font-size: 14px; margin-top: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .wide { overflow-x: auto; }
  tr.col { cursor: pointer; } tr.col:hover td { background: var(--soft); } tr.col.active td { background: var(--soft); font-weight: 600; }
  .tag { display: inline-block; font-size: 12px; padding: 0 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .tag.error, .tag.destructive { color: var(--bad); background: var(--bad-bg); border-color: transparent; }
  .tag.anomaly, .tag.review, .tag.estimate, .tag.guess { color: var(--warn); background: var(--warn-bg); border-color: transparent; }
  .tag.ok, .tag.low { color: var(--ok); background: var(--ok-bg); border-color: transparent; }
  .thread { display: flex; flex-direction: column; gap: 10px; max-height: 70vh; overflow-y: auto; padding-right: 4px; }
  .msg { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); }
  .msg.user { align-self: flex-end; background: var(--soft); max-width: 85%; border: 0; }
  .msg ul { margin: 6px 0; padding-left: 20px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; min-height: 4px; }
  .chip { background: var(--soft); border-radius: 99px; padding: 1px 10px; font-size: 13px; }
  .chip button { border: 0; background: none; padding: 0 0 0 4px; cursor: pointer; color: var(--muted); }
  .suggest { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .status { padding: 8px 10px; border-radius: 6px; margin-top: 8px; font-size: 14px; }
  .status.ok { background: var(--ok-bg); color: var(--ok); } .status.bad { background: var(--bad-bg); color: var(--bad); }
  .status.warn { background: var(--warn-bg); color: var(--warn); }
  .hidden { display: none !important; }
  .chart { width: 100%; height: auto; display: block; margin: 8px 0; }
  .chart-label { font-size: 12px; fill: var(--muted); } .chart-value { font-size: 11px; fill: var(--muted); }
  .chart-bar { fill: var(--accent); } .chart-grid, .chart-axis { stroke: var(--line); stroke-width: 1; }
  .chart-line { fill: none; stroke: var(--accent); stroke-width: 2; } .chart-line.estimate { stroke: var(--warn); stroke-dasharray: 6 4; }
  .chart-line-dot { fill: var(--accent); } .chart-estimate-zone { fill: var(--warn-bg); opacity: .6; }
  .before { color: var(--bad); text-decoration: line-through; } .after { color: var(--ok); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 6px 0; font-size: 14px; }
  dt { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Mapwright Agent</h1>
  <span class="muted">Understand a file, clean it with your approval, analyse it. <a href="/">Schema mode</a></span>
</header>
<main>
  <section class="card" id="upload">
    <div class="row">
      <div><label for="file">CSV or Excel file</label><input type="file" id="file" accept=".csv,text/csv,.xlsx,.xlsm"></div>
      <div id="sheetBox" class="hidden"><label for="sheet">Sheet</label><input type="text" id="sheet" placeholder="first sheet if empty"></div>
      <div><label for="model">Understanding requests</label><select id="model"><option value="rules">Built-in rules (no AI, free)</option></select></div>
      <div><label for="reviewer">Your name (for the history)</label><input type="text" id="reviewer" autocomplete="name"></div>
      <div style="flex:0 0 auto"><button class="primary" id="open">Open the file</button></div>
    </div>
    <p class="hint" id="modelHint"></p>
    <div id="uploadStatus"></div>
  </section>

  <section id="workspace" class="hidden">
    <div class="card">
      <h2 id="fileTitle"></h2>
      <div class="tiles" id="tiles"></div>
      <p id="guess"></p>
      <div class="links">
        <a id="reportLink" target="_blank">Report</a>
        <a id="dashLink" target="_blank">Dashboard</a>
        <a id="csvLink">Download CSV</a>
        <a id="xlsxLink">Download Excel</a>
        <a id="planLink">Download the steps</a>
        <a href="#" id="undo">Undo the last step</a>
        <a href="#" id="showHistory">History</a>
      </div>
    </div>

    <div class="layout">
      <div>
        <div class="card">
          <h2>Columns</h2>
          <p class="hint">Click a column to see what it holds. Tick columns to talk about them.</p>
          <div class="wide"><table>
            <thead><tr><th></th><th>Column</th><th>Type</th><th>Missing</th><th>Issues</th></tr></thead>
            <tbody id="columns"></tbody>
          </table></div>
        </div>
        <div class="card hidden" id="columnCard"></div>
      </div>

      <div class="card">
        <h2>Assistant</h2>
        <div class="thread" id="thread"></div>
        <div class="chips" id="chips"></div>
        <textarea id="ask" placeholder="For example: convert this column to yes/no · standardise these names · fill missing values · top 5 cities by sales · trend per month · find suspicious records · create a dashboard"></textarea>
        <div class="row" style="margin-top:8px">
          <div style="flex:0 0 auto"><button class="primary" id="send">Send</button></div>
          <div class="suggest" id="suggest"></div>
        </div>
      </div>
    </div>
  </section>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs = {}, ...children) => {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v);
    }
    for (const c of children) if (c != null) node.append(c);
    return node;
  };
  let token = "", session = null, overview = null, selected = new Set(), activeColumn = null;

  async function api(path, options = {}) {
    options.headers = Object.assign({}, options.headers, token ? { Authorization: "Bearer " + token } : {});
    let response = await fetch(path, options);
    if (response.status === 401) {
      token = window.prompt("This server needs its API token (MAPWRIGHT_API_TOKEN):") || "";
      options.headers.Authorization = "Bearer " + token;
      response = await fetch(path, options);
    }
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || ("HTTP " + response.status));
    return data;
  }
  const post = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  const sp = (rest) => "/sessions/" + session + rest;
  const withToken = (url) => token ? url + (url.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(token) : url;
  const reviewer = () => $("reviewer").value.trim() || "me";
  const status = (box, kind, text) => { box.replaceChildren(text ? el("div", { class: "status " + kind, text }) : ""); };

  // ---------- setup ----------
  try { $("reviewer").value = localStorage.getItem("mapwright.reviewer") || ""; } catch (e) {}
  $("reviewer").addEventListener("change", () => { try { localStorage.setItem("mapwright.reviewer", $("reviewer").value); } catch (e) {} });
  $("file").addEventListener("change", () => {
    const f = $("file").files[0];
    $("sheetBox").classList.toggle("hidden", !(f && /\.xls[xm]$/i.test(f.name)));
  });
  (async () => {
    try {
      const m = await api("/models");
      for (const name of m.local) $("model").append(el("option", { value: name, text: name.replace("ollama/", "") + " (AI on this computer, free)" }));
      for (const name of m.gemini) $("model").append(el("option", { value: name, text: name + " (Google AI, needs GEMINI_API_KEY)" }));
      $("modelHint").textContent = "Only column names, counts and a few example values are sent to an AI model, never the whole file."
        + (m.local.length ? "" : " For a free AI on this computer, install Ollama and run: ollama pull " + m.local_suggestion.replace("ollama/", ""));
    } catch (e) { /* rules still work */ }
  })();

  $("open").addEventListener("click", async () => {
    const f = $("file").files[0];
    if (!f) return status($("uploadStatus"), "warn", "Choose a file first.");
    $("open").disabled = true;
    status($("uploadStatus"), "warn", "Reading and profiling the file...");
    try {
      const q = new URLSearchParams({ filename: f.name });
      if ($("sheet").value.trim()) q.set("sheet", $("sheet").value.trim());
      const data = await api("/sessions?" + q, { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: f });
      session = data.id; selected.clear(); activeColumn = null;
      $("thread").replaceChildren();
      status($("uploadStatus"), "ok", "Opened. The original file is kept unchanged; every change below needs your approval.");
      render(data);
      $("workspace").classList.remove("hidden");
      introduce(data);
    } catch (e) { status($("uploadStatus"), "bad", e.message); }
    finally { $("open").disabled = false; }
  });

  // ---------- overview ----------
  async function refresh() { render(await api(sp(""))); if (activeColumn) showColumn(activeColumn); }

  function render(data) {
    overview = data;
    const s = data.summary;
    $("fileTitle").textContent = data.meta.filename + (data.meta.read && data.meta.read.sheet ? " · " + data.meta.read.sheet : "");
    $("tiles").replaceChildren(
      el("span", { class: "tile" }, el("b", { text: s.rows.toLocaleString() }), "rows"),
      el("span", { class: "tile" }, el("b", { text: String(s.columns) }), "columns"),
      el("span", { class: "tile" }, el("b", { text: Math.round(data.quality_score * 100) + "%" }), "cells without errors or anomalies"),
      el("span", { class: "tile" }, el("b", { text: String(data.finding_counts.error) }), "errors"),
      el("span", { class: "tile" }, el("b", { text: String(data.finding_counts.anomaly) }), "anomalies"),
      el("span", { class: "tile" }, el("b", { text: String(data.steps) }), "approved steps"));
    $("guess").replaceChildren(s.guess ? el("span", {}, el("span", { class: "tag guess", text: "guess" }), " This looks like " + s.guess + ". Is that right? Tell me what the file is for if not.") : "");
    $("reportLink").href = withToken(sp("/report"));
    $("dashLink").href = withToken(sp("/dashboard"));
    $("csvLink").href = withToken(sp("/export/csv"));
    $("xlsxLink").href = withToken(sp("/export/xlsx"));
    $("planLink").href = withToken(sp("/export/plan"));
    const body = $("columns");
    body.replaceChildren();
    for (const c of data.columns) {
      const box = el("input", { type: "checkbox" });
      box.checked = selected.has(c.name);
      box.addEventListener("click", (ev) => { ev.stopPropagation(); box.checked ? selected.add(c.name) : selected.delete(c.name); renderChips(); });
      const tr = el("tr", { class: "col" + (c.name === activeColumn ? " active" : "") },
        el("td", {}, box), el("td", { text: c.name }), el("td", {}, el("span", { class: "tag", text: c.label })),
        el("td", { text: String(c.blank + c.null_tokens) }),
        el("td", {}, c.findings ? el("span", { class: "tag review", text: String(c.findings) }) : ""));
      tr.addEventListener("click", () => showColumn(c.name));
      body.append(tr);
    }
    renderChips();
    renderSuggestions();
  }

  function renderChips() {
    $("chips").replaceChildren(...[...selected].map((n) => el("span", { class: "chip" }, n,
      el("button", { title: "remove", text: "×", onclick: () => { selected.delete(n); render(overview); } }))));
  }

  function renderSuggestions() {
    const picks = [["What should I fix first?", "show the data quality issues"], ["Which columns matter?", "which columns are useful for analysis"],
                   ["Find suspicious records", "find suspicious records"], ["Overview", "give me an overview of the file"]];
    const dates = overview.columns.filter((c) => c.type === "date"), money = overview.columns.filter((c) => c.role === "measure");
    if (dates.length && money.length) picks.push(["Trend per month", "trend of " + money[0].name + " per month"]);
    $("suggest").replaceChildren(...picks.map(([label, text]) => el("button", { class: "small", text: label, onclick: () => send(text, []) })));
  }

  function introduce(data) {
    const s = data.summary, issues = data.finding_counts;
    const msg = el("div", { class: "msg" });
    msg.append(el("div", { text: `I read ${s.rows.toLocaleString()} rows and ${s.columns} columns. ` +
      `I found ${issues.error} errors, ${issues.anomaly} things that look unusual and ${issues.recommendation} formatting suggestions. ` +
      `Click a column to see what it holds, or ask me something.` }));
    $("thread").append(msg);
  }

  // ---------- column panel ----------
  async function showColumn(name) {
    activeColumn = name;
    for (const tr of $("columns").children) tr.classList.toggle("active", tr.children[1].textContent === name);
    const c = await api(sp("/columns/" + encodeURIComponent(name)));
    const card = $("columnCard");
    const typeSelect = el("select", {}, el("option", { value: "auto", text: "as found (" + c.label + ")" }),
      ...c.types.map((t) => el("option", { value: t, text: t })));
    const overridden = overview.meta.types && overview.meta.types[name];
    typeSelect.value = overridden || "auto";
    typeSelect.addEventListener("change", async () => {
      await post(sp("/columns/" + encodeURIComponent(name) + "/type"), { type: typeSelect.value, reviewer: reviewer() });
      await refresh();
    });
    const stats = Object.entries(c.stats || {}).map(([k, v]) => [k, typeof v === "number" ? v.toLocaleString() : String(v)]);
    card.replaceChildren(
      el("h2", { text: c.name }),
      el("dl", {},
        el("dt", { text: "Type" }), el("dd", {}, typeSelect),
        el("dt", { text: "Role" }), el("dd", { text: c.role }),
        el("dt", { text: "Meaning" }), el("dd", {}, c.meaning ? el("span", {}, el("span", { class: "tag guess", text: "guess" }), " " + c.meaning) : el("span", { class: "muted", text: "no guess from the name" })),
        el("dt", { text: "Filled" }), el("dd", { text: `${c.filled} of ${c.rows} (${c.blank + c.null_tokens} missing), ${c.distinct} distinct` }),
        ...stats.flatMap(([k, v]) => [el("dt", { text: k }), el("dd", { text: v })])),
      el("h3", { text: "Why I think so" }), el("ul", {}, ...c.evidence.map((e) => el("li", { text: e }))),
      el("h3", { text: "Examples" }), el("p", { text: c.examples.join(" · ") || "none" }),
      c.misfits.length ? el("p", {}, el("b", { text: "Values that do not fit: " }), c.misfits.join(" · ")) : "",
      c.findings.length ? el("h3", { text: "Issues" }) : "",
      ...c.findings.map(findingNode),
      el("div", { class: "suggest" },
        el("button", { class: "small", text: "Talk about this column", onclick: () => { selected.add(name); render(overview); $("ask").focus(); } }),
        el("button", { class: "small", text: "Summarise", onclick: () => send("summarise " + name, [name]) })));
    card.classList.remove("hidden");
  }

  function findingNode(f) {
    return el("div", { class: "msg", style: "margin:6px 0" },
      el("div", {}, el("span", { class: "tag " + f.severity, text: f.severity }), " ", el("b", { text: f.title })),
      el("div", { class: "hint", text: f.detail }),
      f.examples.length ? el("div", { class: "hint", text: "Examples: " + f.examples.slice(0, 5).join(" · ") }) : "",
      f.fixes.length ? el("div", { class: "suggest" }, ...f.fixes.map((op) => el("button", { class: "small", text: "Preview fix: " + opLabel(op),
        onclick: async () => { try { addProposal(await post(sp("/proposals"), { op })); } catch (e) { say(e.message, "bad"); } } }))) : "");
  }
  const opLabel = (op) => op.op.replace(/_/g, " ") + (op.order ? " (" + op.order.replace("_", " ") + ")" : "");

  // ---------- conversation ----------
  function say(text, kind) {
    const m = el("div", { class: "msg" + (kind ? " " : "") }, kind ? el("div", { class: "status " + kind, text }) : el("div", { text }));
    $("thread").append(m); m.scrollIntoView({ behavior: "smooth", block: "end" });
  }

  async function send(text, columns) {
    text = (text || "").trim();
    if (!text) return;
    $("thread").append(el("div", { class: "msg user", text: text + (columns.length ? "  [" + columns.join(", ") + "]" : "") }));
    $("send").disabled = true;
    try {
      const r = await post(sp("/ask"), { text, columns, model: $("model").value });
      renderAnswer(r);
    } catch (e) { say(e.message, "bad"); }
    finally { $("send").disabled = false; }
  }
  $("send").addEventListener("click", () => { const t = $("ask").value; $("ask").value = ""; send(t, [...selected]); });
  $("ask").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("send").click(); } });

  function renderAnswer(r) {
    if (r.note) say(r.note, "warn");
    if (r.message) say(r.message);
    for (const p of r.problems || []) say("Skipped: " + p, "warn");
    if (r.explanations) for (const x of r.explanations) say(x);
    for (const p of r.proposals || []) addProposal(p);
    for (const res of r.results || []) addResult(res);
    if (r.kind === "clarify") addQuestion(r);
    if (r.findings) addFindings(r.findings);
    if (r.kind === "report") window.open(withToken(sp("/report")), "_blank");
    if (r.kind === "dashboard") window.open(withToken(sp("/dashboard")), "_blank");
    $("thread").lastElementChild && $("thread").lastElementChild.scrollIntoView({ behavior: "smooth", block: "end" });
  }

  function addQuestion(r) {
    const box = el("div", { class: "msg" }, el("b", { text: r.question }));
    const buttons = el("div", { class: "suggest" });
    for (const o of r.options || []) {
      buttons.append(el("button", { class: "small", text: o.label, onclick: async () => {
        try {
          if (o.op) addProposal(await post(sp("/proposals"), { op: o.op }));
          else if (o.query) addResult(await post(sp("/query"), { query: o.query }));
          else if (o.ask_value) {
            const v = window.prompt("Value to fill with:");
            if (v !== null && v.trim()) addProposal(await post(sp("/proposals"), { op: { ...o.ask_value, value: v.trim() } }));
          } else if (o.message) say(o.message);
        } catch (e) { say(e.message, "bad"); }
      } }));
    }
    box.append(buttons);
    $("thread").append(box);
  }

  function addFindings(findings) {
    const box = el("div", { class: "msg" }, el("b", { text: findings.length ? `${findings.length} findings, most important first` : "No findings." }));
    for (const f of findings.slice(0, 12)) box.append(findingNode(f));
    if (findings.length > 12) box.append(el("div", { class: "hint", text: `${findings.length - 12} more in the report.` }));
    $("thread").append(box);
  }

  function addProposal(p) {
    const e = p.effect;
    const box = el("div", { class: "msg" });
    const counts = [`${e.cells_changed} cells in ${e.rows_changed} rows change`];
    if (e.rows_removed) counts.push(`${e.rows_removed} rows are removed`);
    if (e.columns_added.length) counts.push("new columns: " + e.columns_added.join(", "));
    if (e.columns_removed.length) counts.push("removed column: " + e.columns_removed.join(", "));
    if (e.renamed) counts.push(`renamed ${e.renamed[0]} → ${e.renamed[1]}`);
    const examples = e.examples.length ? el("div", { class: "wide" }, el("table", {},
      el("thead", {}, el("tr", {}, el("th", { text: "Row" }), el("th", { text: "Column" }), el("th", { text: "Before" }), el("th", { text: "After" }))),
      el("tbody", {}, ...e.examples.map((x) => el("tr", {}, el("td", { text: String(x.row) }), el("td", { text: x.column }),
        el("td", {}, el("span", { class: "before", text: x.before || "(empty)" })), el("td", {}, el("span", { class: "after", text: x.after || "(empty)" }))))))) : "";
    const result = el("div");
    const approve = el("button", { class: "primary small", text: p.risk === "destructive" ? "Approve (removes or fills data)" : "Approve" });
    const reject = el("button", { class: "small", text: "Reject" });
    const decide = async (decision) => {
      approve.disabled = reject.disabled = true;
      try {
        const r = await post(sp("/proposals/" + p.id), { decision, reviewer: reviewer() });
        if (decision === "reject") { status(result, "warn", "Rejected. Nothing changed."); return; }
        const v = r.validation;
        let text = `Applied. Rows ${v.rows_before} → ${v.rows_after}; errors ${v.errors_before} → ${v.errors_after}; anomalies ${v.anomalies_before} → ${v.anomalies_after}.`;
        if (v.resolved.length) text += " Resolved: " + v.resolved.join("; ") + ".";
        if (v.new.length) text += " New: " + v.new.join("; ") + ".";
        status(result, "ok", text);
        await refresh();
      } catch (err) { status(result, "bad", err.message); approve.disabled = reject.disabled = false; }
    };
    approve.addEventListener("click", () => decide("approve"));
    reject.addEventListener("click", () => decide("reject"));
    box.append(
      el("div", {}, el("span", { class: "tag " + p.risk, text: p.risk === "low" ? "safe" : p.risk }), " ", el("b", { text: p.title })),
      el("div", { class: "hint", text: p.risk_text }),
      el("div", { text: counts.join("; ") + "." }),
      e.notes.length ? el("ul", { class: "hint" }, ...e.notes.map((n) => el("li", { text: n }))) : "",
      e.unmatched.length ? el("div", { class: "hint", text: "Left unchanged: " + e.unmatched.map((u) => `${u.value} (${u.count})`).join(" · ") }) : "",
      examples,
      el("div", { class: "suggest" }, approve, reject), result);
    $("thread").append(box);
    box.scrollIntoView({ behavior: "smooth", block: "end" });
  }

  function addResult(r) {
    const box = el("div", { class: "msg" });
    const holder = el("div");
    holder.innerHTML = r.svg || "";  // drawn on the server from computed numbers; labels escaped there
    const t = r.table;
    const table = t && t.rows && t.rows.length ? el("div", { class: "wide" }, el("table", {},
      el("thead", {}, el("tr", {}, ...t.columns.map((c) => el("th", { text: String(c) })))),
      el("tbody", {}, ...t.rows.slice(0, 12).map((row) => el("tr", {}, ...row.map((v) => el("td", { text: String(v) }))))))) : "";
    const pin = el("button", { class: "small", text: "Add to dashboard" });
    pin.addEventListener("click", async () => {
      try { await post(sp("/pins"), { query: r.query, title: r.title }); pin.textContent = "Added"; pin.disabled = true; await refresh(); }
      catch (e) { say(e.message, "bad"); }
    });
    box.append(
      el("div", {}, el("span", { class: "tag " + (r.estimate ? "estimate" : "ok"), text: r.estimate ? "estimate" : "calculated" }), " ", el("b", { text: r.title })),
      holder,
      el("ul", {}, ...r.facts.map((f) => el("li", { text: f }))),
      r.caveats.length ? el("ul", { class: "hint" }, ...r.caveats.map((c) => el("li", { text: c }))) : "",
      table, el("div", { class: "suggest" }, pin));
    $("thread").append(box);
  }

  // ---------- history and undo ----------
  $("undo").addEventListener("click", async (ev) => {
    ev.preventDefault();
    try { const r = await post(sp("/undo"), { reviewer: reviewer() }); say(`Undid: ${opLabel(r.undone)} on ${r.undone.column || "the table"}. ${r.steps} steps remain.`, "warn"); await refresh(); }
    catch (e) { say(e.message, "bad"); }
  });
  $("showHistory").addEventListener("click", async (ev) => {
    ev.preventDefault();
    const h = (await api(sp("/history"))).history;
    const rows = h.map((x) => el("tr", {}, el("td", { text: x.at.replace("T", " ").slice(0, 19) }), el("td", { text: x.event }),
      el("td", { text: x.op ? opLabel(x.op) + (x.op.column ? " · " + x.op.column : "") : (x.column || x.filename || "") }),
      el("td", { text: x.cells != null ? `${x.cells} cells` + (x.rows_removed ? `, ${x.rows_removed} rows removed` : "") : "" }),
      el("td", { text: x.actor || "" })));
    $("thread").append(el("div", { class: "msg" }, el("b", { text: "History" }), el("div", { class: "wide" }, el("table", {},
      el("thead", {}, el("tr", {}, ...["When", "Event", "What", "Effect", "By"].map((c) => el("th", { text: c })))), el("tbody", {}, ...rows)))));
    $("thread").lastElementChild.scrollIntoView({ behavior: "smooth", block: "end" });
  });
})();
</script>
</body>
</html>
