[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mapwright"
version = "0.1.0"
description = "Onboards messy legacy data exports into a validated target schema."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
excel = [
    "openpyxl>=3.1",
]
dev = [
    "pytest>=8.0",
    "openpyxl>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mapwright = ["policy.yaml", "rules/*.yaml", "ui.html", "ui_agent.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
