# Sensitivity check: the pre-registered policy without the rule that holds
# an LLM action changing more than 20% of a column. Everything else is the
# same as src/mapwright/policy.yaml. Results under this file are reported
# separately and never replace the pre-registered ones.

review_issues: [M4, M6, S3, S5, S7, S8, V2, V4, V7]
hold_actions: [drop_rows]
min_llm_confidence: 0.8
large_change_share: 0.2
large_change_origins: []
